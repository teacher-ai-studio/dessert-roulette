<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#fff8e8"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="シェ・ふじた"><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icons/icon-192.png"><title>シェ・ふじた｜デザートあみだ</title><style>
:root{--ink:#302720;--cream:#fff8e8;--red:#ed443f;--yellow:#f5d12f;--blue:#4389e6;--line:#604d3f}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--cream);color:var(--ink);font-family:"Hiragino Maru Gothic ProN","Yu Gothic",sans-serif}button{font:inherit;color:inherit;touch-action:manipulation}.screen{display:none;width:100%;height:100%;min-height:100dvh;padding:max(14px,env(safe-area-inset-top)) max(18px,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left))}.screen.active{display:flex}
#home{flex-direction:column;align-items:center;justify-content:center;gap:clamp(18px,4vh,44px);background:radial-gradient(circle at 50% 18%,#fff 0,#fff9ed 64%,#ffedc1 100%)}h1{font-size:clamp(44px,7vw,86px);margin:0;letter-spacing:.08em}.lead{font-size:clamp(21px,2.7vw,34px);font-weight:900;margin:-18px 0 0}.shape-grid{display:grid;grid-template-columns:repeat(3,minmax(170px,28vw));gap:clamp(16px,4vw,52px)}.shape-btn{height:clamp(205px,34vh,330px);border:5px solid #fff;border-radius:32px;background:#fff;box-shadow:0 12px 28px #5f492323;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;font-size:clamp(27px,3vw,41px);font-weight:900}.shape-btn:active{transform:scale(.97)}.shape{display:block;width:clamp(102px,15vw,174px);height:clamp(102px,15vw,174px);filter:drop-shadow(0 7px 3px #31251c20)}.circle{border-radius:50%;background:var(--red);border:5px solid #b82421}.square{background:var(--blue);border:5px solid #195ca9;border-radius:6px}.triangle{background:var(--yellow);clip-path:polygon(50% 2%,98% 94%,2% 94%)}
#game{position:relative;flex-direction:column;align-items:center}.game-head{height:8vh;min-height:55px;display:flex;align-items:center;gap:14px;font-size:clamp(24px,3vw,38px);font-weight:900}.mini{width:43px;height:43px;flex:none}.board{position:relative;width:min(1050px,97vw);height:86vh;max-height:830px;min-height:540px;background:#fff;border:4px solid #ecd69e;border-radius:28px;box-shadow:0 10px 26px #5139181d;overflow:hidden}.status{position:absolute;top:1.4%;left:0;right:0;text-align:center;font-size:clamp(20px,2.5vw,31px);font-weight:900;z-index:3}.amida{position:absolute;left:9%;right:9%;top:9%;height:60%}.amida svg{width:100%;height:100%;overflow:visible}.amida line{stroke:var(--line);stroke-width:8;stroke-linecap:round}.runner{position:absolute;z-index:6;width:clamp(50px,6.5vw,73px);height:clamp(50px,6.5vw,73px);transform:translate(-50%,-50%);transition:left .38s linear,top .38s linear;filter:drop-shadow(0 5px 3px #0004)}.dessert-row{position:absolute;left:2.5%;right:2.5%;bottom:1.8%;height:27%;display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(8px,2vw,22px)}.dessert-card{min-width:0;border:4px solid #efcbd0;border-radius:24px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px;overflow:hidden;box-shadow:0 5px 14px #51391818}.dessert-card img{width:100%;height:76%;object-fit:contain}.dessert-card strong{font-size:clamp(17px,2.4vw,30px);line-height:1.05;white-space:nowrap}.dessert-card.chosen{border-color:#ff9b20;box-shadow:0 0 0 8px #ffd457,0 0 34px 15px #ffbc2e99;animation:chosen .55s ease-in-out 2}.dessert-card.dim{opacity:.42}@keyframes chosen{50%{transform:scale(1.055)}}
#result{flex-direction:column;align-items:center;justify-content:center;gap:12px;background:radial-gradient(circle,#fff 0,#fff7df 72%,#ffe6a8 100%)}.result-kicker{font-size:clamp(23px,3vw,39px);font-weight:900;color:#bd342f;margin:0}#resultName{font-size:clamp(41px,6vw,72px);margin:0}.dessert-frame{width:min(72vw,710px);height:min(61vh,600px);display:flex;align-items:center;justify-content:center;background:#fff;border:5px solid #f2c8cf;border-radius:34px;box-shadow:0 12px 32px #51391828;overflow:hidden}.dessert-frame img{width:100%;height:100%;object-fit:contain}.back{width:min(420px,72vw);min-height:74px;border:0;border-radius:999px;background:#37312d;color:#fff;font-size:clamp(27px,3vw,39px);font-weight:900;box-shadow:0 7px 0 #171411}.back:active{transform:translateY(5px);box-shadow:0 2px 0 #171411}.burst{animation:burst .55s cubic-bezier(.2,.9,.3,1.4)}@keyframes burst{0%{transform:scale(.2);opacity:0}70%{transform:scale(1.07)}100%{transform:scale(1);opacity:1}}
@media(max-width:760px){.shape-grid{grid-template-columns:repeat(3,1fr);width:100%;gap:9px}.shape-btn{min-width:0;height:38vh}.shape{width:28vw;height:28vw}.dessert-card strong{font-size:16px}}@media(orientation:portrait){#home{justify-content:flex-start;padding-top:7vh}.shape-grid{grid-template-columns:1fr;width:min(82vw,520px)}.shape-btn{height:20vh;flex-direction:row}.shape{width:15vh;height:15vh}.board{height:84vh}.amida{height:62%;left:5%;right:5%}.dessert-row{left:1%;right:1%;gap:5px}.dessert-card{border-radius:14px;border-width:3px}.dessert-card strong{font-size:clamp(13px,3.3vw,20px)}}
.runner{width:clamp(115px,14vw,160px);height:clamp(115px,14vw,160px);transition:left .75s linear,top .75s linear;filter:none;will-change:left,top;backface-visibility:hidden}
@media (max-height:600px) and (orientation:landscape){html,body{overflow-y:auto}.screen{height:auto;min-height:100svh;padding:7px 12px}#home{gap:7px;justify-content:flex-start}h1{font-size:clamp(30px,9vh,48px);line-height:1}.lead{font-size:clamp(17px,5vh,25px);margin:0}.shape-grid{width:100%;gap:12px}.shape-btn{height:clamp(155px,55vh,245px);border-radius:22px;gap:5px;font-size:clamp(20px,6vh,30px)}.shape{width:clamp(78px,29vh,135px);height:clamp(78px,29vh,135px)}.game-head{height:42px;min-height:42px;font-size:22px}.mini{width:32px;height:32px}.board{height:calc(100svh - 56px);min-height:430px}.dessert-card strong{font-size:clamp(13px,3.6vh,20px)}#result{min-height:100svh;gap:5px}.result-kicker{font-size:20px}#resultName{font-size:34px}.dessert-frame{height:55vh}.back{min-height:50px;font-size:24px}}
@media (orientation:portrait) and (max-width:600px){html,body{overflow-y:auto}.screen{height:auto;min-height:100svh}#home{padding-top:24px;padding-bottom:24px;gap:12px}.shape-grid{gap:10px}.shape-btn{min-height:135px;height:18svh}.shape{width:min(13svh,110px);height:min(13svh,110px)}.board{height:calc(100svh - 75px);min-height:620px}.runner{width:clamp(82px,22vw,120px);height:clamp(82px,22vw,120px)}.dessert-row{height:24%}#result{min-height:100svh;padding-top:20px;padding-bottom:20px}.dessert-frame{width:92vw;height:52svh}}

.material-home-link{position:fixed;z-index:1000;right:max(12px,env(safe-area-inset-right));top:max(10px,env(safe-area-inset-top));display:flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:8px 14px;border:3px solid #604d3f;border-radius:999px;background:#fff;color:#302720;text-decoration:none;font-size:clamp(15px,2vw,19px);font-weight:900;box-shadow:0 3px 8px #30272026;touch-action:manipulation}
.material-home-link:focus-visible{outline:4px solid #4389e6;outline-offset:3px}
@media(max-width:480px){.material-home-link{font-size:14px;min-height:42px;padding:7px 10px}}
</style></head><body><a class="material-home-link" href="https://teacher-ai-studio.github.io/math-shapes-studio/home.html" aria-label="教材ホームへ戻る">🏠 教材ホーム</a><main>
<section id="home" class="screen active"><h1>シェ・ふじた</h1><p class="lead">どの かたちに する？</p><div class="shape-grid"><button class="shape-btn" data-kind="circle"><span class="shape circle"></span><span>まる</span></button><button class="shape-btn" data-kind="triangle"><span class="shape triangle"></span><span>さんかく</span></button><button class="shape-btn" data-kind="square"><span class="shape square"></span><span>しかく</span></button></div></section>
<section id="game" class="screen" aria-live="polite"><div class="game-head"><span id="headShape" class="mini"></span><span id="headText"></span></div><div class="board"><div class="amida"><svg id="amidaSvg" viewBox="0 0 1000 600" preserveAspectRatio="none"></svg><div id="runner" class="runner"></div></div><div id="dessertRow" class="dessert-row"></div></div></section>
<section id="result" class="screen" aria-live="assertive"><p class="result-kicker">きょうの デザートは…</p><h2 id="resultName"></h2><div class="dessert-frame"><img id="resultImage" alt=""></div><button id="back" class="back">もどる</button></section><audio id="drumroll" src="audio/drumroll.wav" preload="auto"></audio>
</main><script>
const data={circle:{label:'まる',items:[['ドーナツ','images/donut.png'],['マカロン','images/macaron.png'],['バームクーヘン','images/baumkuchen.png']]},triangle:{label:'さんかく',items:[['ショートケーキ','images/shortcake.png'],['ガトーショコラ','images/gateau-chocolat.png'],['チーズケーキ','images/cheesecake.png']]},square:{label:'しかく',items:[['クッキー','images/cookie.png'],['ワッフル','images/waffle.png'],['フィナンシェ','images/financier.png']]}};
const $=s=>document.querySelector(s),home=$('#home'),game=$('#game'),result=$('#result'),runner=$('#runner'),headShape=$('#headShape'),headText=$('#headText'),dessertRow=$('#dessertRow'),resultName=$('#resultName'),resultImage=$('#resultImage'),drumroll=$('#drumroll'),screens=[home,game,result],xs=[12,50,88],ys=[23,41,59,77];let busy=false;
function show(el){screens.forEach(s=>s.classList.toggle('active',s===el))}function setShape(el,k,base){el.className=base+' '+k}function endLane(seq){let lane=1;seq.forEach(p=>{if(lane===p)lane++;else if(lane===p+1)lane--});return lane}
function moveCount(seq){let lane=1,moves=0;seq.forEach(p=>{if(lane===p){lane++;moves++}else if(lane===p+1){lane--;moves++}});return moves}
function makeRoute(target){const choices=[];for(let n=0;n<16;n++){const seq=[];for(let i=0;i<4;i++)seq.push((n>>i)&1);const wanted=target===1?2:3;if(endLane(seq)===target&&moveCount(seq)===wanted)choices.push(seq)}return choices[Math.floor(Math.random()*choices.length)]}
function draw(seq){const svg=$('#amidaSvg');svg.innerHTML='';xs.forEach(x=>svg.insertAdjacentHTML('beforeend',`<line x1="${x*10}" y1="45" x2="${x*10}" y2="570"/>`));seq.forEach((p,i)=>svg.insertAdjacentHTML('beforeend',`<line x1="${xs[p]*10}" y1="${ys[i]*6}" x2="${xs[p+1]*10}" y2="${ys[i]*6}"/>`))}
function cards(kind){dessertRow.innerHTML=data[kind].items.map(([n,s],i)=>`<div class="dessert-card" data-i="${i}"><img src="${s}" alt="${n}"><strong>${n}</strong></div>`).join('')}
function wait(ms){return new Promise(r=>setTimeout(r,ms))}
function point(x,y,instant=false){return new Promise(r=>{runner.style.transitionDuration=instant?'0s':'.75s';runner.style.left=x+'%';runner.style.top=y+'%';setTimeout(r,instant?40:770)})}
async function play(kind){if(busy)return;busy=true;show(game);setShape(headShape,kind,'mini');setShape(runner,kind,'runner');headText.textContent=data[kind].label+'の デザート';cards(kind);const target=Math.floor(Math.random()*3),seq=makeRoute(target);draw(seq);let lane=1;await point(xs[lane],3,true);drumroll.currentTime=0;drumroll.volume=.9;drumroll.play().catch(()=>{});
for(let i=0;i<seq.length;i++){await point(xs[lane],ys[i]);await wait(800);if(lane===seq[i]){lane++;await point(xs[lane],ys[i])}else if(lane===seq[i]+1){lane--;await point(xs[lane],ys[i])}}await point(xs[lane],96);const cs=[...document.querySelectorAll('.dessert-card')];cs.forEach((c,i)=>c.classList.add(i===lane?'chosen':'dim'));await wait(Math.max(700,(9.55-drumroll.currentTime)*1000));const [name,src]=data[kind].items[lane];resultName.textContent=name;resultImage.src=src;resultImage.alt=name;show(result);const frame=$('.dessert-frame');frame.classList.remove('burst');void frame.offsetWidth;frame.classList.add('burst');busy=false}
document.querySelectorAll('.shape-btn').forEach(b=>b.addEventListener('click',()=>play(b.dataset.kind)));$('#back').addEventListener('click',()=>{drumroll.pause();show(home)});if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}))}
</script></body></html>
